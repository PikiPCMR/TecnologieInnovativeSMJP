<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Reimposta Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles/login.css" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="wrapper">
    <div class="login-container">
      <h2>Reimposta la tua password</h2>

     <div id="resetForm" style="display: none;">
        <div class="form-group">
          <label for="newPassword">Nuova Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Inserisci nuova password" />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword', this)">Mostra</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Conferma Nuova Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Ripeti nuova password" />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">Mostra</button>
          </div>
        </div>

        <div id="errorMessage" style="color: #e63946; font-size: 0.9rem; margin-bottom: 10px;"></div>

        <div class="popup-buttons">
          <button class="popup-btn-secondary" id="cancelBtn">Annulla</button>
          <button class="popup-btn" id="saveBtn">Salva</button>
        </div>
      </div>

      <div id="waitMessage" style="text-align: center;">
        <p>Attendere... stiamo verificando il link.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './src/collegamentoDb.js';

  (async () => {
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const errorBox = document.getElementById("errorMessage");
    const resetForm = document.getElementById("resetForm");
    const waitMessage = document.getElementById("waitMessage");

    let session = null;

    const { data, error: sessionError } = await supabase.auth.getSession();
    session = data.session;

    if (session && session.user) {
      waitMessage.style.display = "none";
      resetForm.style.display = "block";
    } else {
      waitMessage.innerHTML = "<p>Link non valido o già usato.</p><a href='login.html'>Torna al login</a>";
    }

    document.getElementById("cancelBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      errorBox.textContent = "";
      const newPass = newPassword.value.trim();
      const confirmPass = confirmPassword.value.trim();

      if (!newPass || !confirmPass) {
        errorBox.textContent = "Entrambi i campi sono obbligatori.";
        return;
      }

      if (newPass !== confirmPass) {
        errorBox.textContent = "Le password non corrispondono.";
        return;
      }

      const isValid = /^(?=.*[A-Z]).{6,}$/.test(newPass);
      if (!isValid) {
        errorBox.textContent = "La password deve contenere almeno 6 caratteri e una lettera maiuscola.";
        return;
      }

      const { error } = await supabase.auth.updateUser({
        password: newPass
      });

      if (error) {
        errorBox.textContent = "Errore nel reset: " + error.message;
        return;
      }

      // Aggiorna anche la tabella "registrazione"
      const email = session.user.email;

      const { error: updateDbError } = await supabase
        .from('registrazione')
        .update({ password: newPass })
        .eq('email', email);

      if (updateDbError) {
        console.error("Errore aggiornamento tabella registrazione:", updateDbError.message);
      }

      alert("Password aggiornata con successo!");
      window.location.href = "login.html";
    });

    supabase.auth.onAuthStateChange((event, session) => {
      console.log("Cambio stato auth:", event);
    });
  })();

  function togglePasswordVisibility(inputId, button) {
  const input = document.getElementById(inputId);
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  button.textContent = isHidden ? "Nascondi" : "Mostra";
}

window.togglePasswordVisibility = togglePasswordVisibility;

</script>

</body>
</html>
