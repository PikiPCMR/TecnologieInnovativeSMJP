<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrazione Gestore</title>
  <link rel="stylesheet" href="styles/register.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo-link">
      <div class="logo">WorkSpace Pro</div>
    </a>
  </header>

  <div class="wrapper">
    <div class="login-container">
      <h2>Info Gestore</h2>
      <form id="gestoreForm">
        <div class="form-group">
          <label for="nome">Nome: <span class="required">*</span></label>
          <input type="text" id="nome" required>
        </div>

        <div class="form-group">
          <label for="cognome">Cognome: <span class="required">*</span></label>
          <input type="text" id="cognome" required>
        </div>

        <div class="form-group">
          <label for="azienda">Azienda:</label>
          <input type="text" id="azienda">
        </div>

        <div class="form-group">
          <label for="piva">Partita IVA o Indirizzo Fatturazione: <span class="required">*</span></label>
          <input type="text" id="piva" required>
        </div>

        <button type="submit" class="login-button">Conferma registrazione</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="src/register.js"></script>
</body>
</html>
