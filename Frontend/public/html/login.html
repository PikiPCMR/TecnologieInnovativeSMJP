<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="../styles/login.css"/>
  <link rel="stylesheet" href="../styles/styles.css" /> <!-- Per stile coerente -->
</head>

<body>

 <header class="header" >
    <a href="index.html" class="logo-link">
      <div class="logo">WorkSpace Pro</div>
    </a>
  </header>

  <div class="wrapper">
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="id" name="id" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required />
            <button type="button" id="togglePassword" class="toggle-password">Mostra</button>
          </div>
        </div>
        <div class="form-group">
          <p class="forgot-password"> 
            <a href="#" id="openResetPopup">Password dimenticata?</a>
          </p>
        <div class="form-group">
          <button type="submit">Accedi</button>
        </div>
      </form>
      <p>Non hai un account? <a href="register.html">Registrati</a></p>
    </div>
  </div>
<!-- POPUP STILE MODERNO - RESET PASSWORD -->
  <div id="resetPasswordModal" class="overlay-popup" style="display: none;">
    <div class="popup-box">
      <h3>Reset della Password</h3>
      <p>Inserisci la tua email per ricevere il link di reimpostazione.</p>
      <input
        type="email"
        id="resetEmail"
        placeholder="esempio@email.com"
        required
        style="width: 100%; padding: 12px 15px; margin: 20px 0 8px 0; border-radius: 10px; border: 1px solid #ccc;"
      />
      <span id="emailError" style="color: #ff6b6b; font-size: 0.85rem;"></span>
      <div class="popup-buttons">
        <button id="sendResetLink" class="popup-btn">Invia richiesta reset password</button>
        <button id="closeResetModal" class="popup-btn-secondary">Chiudi</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
