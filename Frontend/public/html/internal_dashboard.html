<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/avatar.css">
    <link rel="stylesheet" href="../styles/internal_dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../js/internal_dashboard.js"></script>
    <script type="module" src="../js/index.js"></script>
    <script type="module">
        import { caricaAvatarUtente } from '../js/gestione_avatar.js';

        window.addEventListener('DOMContentLoaded', () => {
            caricaAvatarUtente();
        });
    </script>
    <title>WorkSpace Pro - Prenota il tuo spazio</title>
</head>

<body>
    <header class="header">
        <a href="dashboard_gestore.html" class="logo-link">
            <div class="logo">WorkSpace Pro</div>
        </a>
        <div class="profile-section">
            <div class="profile-btn" onclick="toggleProfileMenu()">
                <img id="avatar" class="avatar avatar-small"
                    src="https://sbxrdptjegjxqaklfpxq.supabase.co/storage/v1/object/public/immaginiprofilo//user.png"
                    alt="Avatar" />
            </div>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-item" id="loginText" onclick="accedi()">
                    <span>🔑 Accedi&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" onclick="registrati()">
                    <span>📝 Registrati&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" id="profileItem" style="display: none;" onclick="handleProfile()">
                    <span>🔓 Il mio profilo&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" id="logoutItem" style="display: none;" onclick="handleLogout()">
                    <span>🚪 Esci&nbsp;&nbsp;</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="welcome-section">
            <h1 class="welcome-title">Riepilogo statistiche</h1>
            <p class="welcome-subtitle">Benvenuto nella pagina statistiche, qui potrai consultare l'andamento dei tuoi
                spazi. </p>
        </section>

        <section class="statistica_tempo">
            <h3>Riepilogo andamento ultimo anno</h3>
        </section>

        <div class="action-cards">
            <div class="action-card" id="c">

                <div class="table-container">
                    <table id="tabella-prenotazioni"></table>
                </div>

                <div class="chart-container" id="p">
                    <canvas id="chart-grafico-prenotazioni-barre"></canvas>
                </div>

                <div class="chart-container" id="p">
                    <canvas id="chart-grafico-economico-barre"></canvas>
                </div>

                <div class="chart-container" id="p">
                    <canvas id="chart-tipi-spazi-prenotati"></canvas>
                </div>

                <div class="chart-container" id="p">
                    <canvas id="chart-andamento-economico"></canvas>
                </div>

                <div class="chart-container" id="p">
                    <canvas id="chart-fasce-prenotate"></canvas>
                </div>

            </div>
        </div>


    </main>
</body>

</html>
