<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="id" name="id" required />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="form-group">
        <button type="submit">Accedi</button>
      </div>
    </form>
    <p>Non hai un account? <a href="register.html">Registrati</a></p>
  </div>
</body>

<script>
  // Inizializza Supabase
  const supabaseUrl = 'https://sbxrdptjegjxqaklfpxq.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNieHJkcHRqZWdqeHFha2xmcHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2MjcxMTcsImV4cCI6MjA2MjIwMzExN30.-eNAPw6hGKrSLtYmFSxxneOtEKrAyH6OUi_pKZmg-zs'; // ← usa la tua anon key
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function login() {
    const id = document.getElementById('id').value.trim();
    const password = document.getElementById('password').value.trim();

    // Query alla tabella "utenti"
    const { data, error } = await supabase
      .from('registrazione')
      .select('*')
      .eq('id', id)
      .eq('password', password)  // ⚠️ In produzione: MAI salvare password in chiaro!

    if (error) {
      alert('Errore nel login: ' + error.message);
      console.error(error);
      return;
    }

    if (data.length === 0) {
      alert('Credenziali errate');
    } else {
      // Login riuscito
      alert('Accesso effettuato con successo!');
      localStorage.setItem('user', JSON.stringify(data[0]));
      window.location.href = 'index.html';
    }
  }
</script>
</html>
