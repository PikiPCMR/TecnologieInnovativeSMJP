<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css"/>
  <link rel="stylesheet" href="styles.css" /> <!-- Per stile coerente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

 <header class="header" >
    <a href="index.html" class="logo-link">
      <div class="logo">WorkSpace Pro</div>
    </a>
  </header>

  <div class="wrapper">
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="id" name="id" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required />
            <button type="button" id="togglePassword" class="toggle-password">Mostra</button>
          </div>
        </div>


        <div class="form-group">
          <button type="submit">Accedi</button>
        </div>
      </form>
      <p>Non hai un account? <a href="register.html">Registrati</a></p>
    </div>
  </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="src/login.js"></script>

</body>
</html>
