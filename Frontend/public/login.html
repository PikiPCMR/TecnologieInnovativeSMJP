<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css"/>
  <link rel="stylesheet" href="styles.css" /> <!-- Per stile coerente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

 <header class="header" >
    <a href="index.html" class="logo-link">
      <div class="logo">WorkSpace Pro</div>
    </a>
  </header>

  <div class="wrapper">
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="id" name="id" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" required />
            <span id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 14px; color: #ccc;">
              Mostra
            </span>
          </div>
        </div>

        <div class="form-group">
          <button type="submit">Accedi</button>
        </div>
      </form>
      <p>Non hai un account? <a href="register.html">Registrati</a></p>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://sbxrdptjegjxqaklfpxq.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNieHJkcHRqZWdqeHFha2xmcHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2MjcxMTcsImV4cCI6MjA2MjIwMzExN30.-eNAPw6hGKrSLtYmFSxxneOtEKrAyH6OUi_pKZmg-zs';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const id = document.getElementById('id').value.trim();
      const password = document.getElementById('password').value.trim();

      const { data, error } = await supabase
        .from('registrazione')
        .select('*')
        .eq('id', id)
        .eq('password', password);

      if (error) {
        alert('Errore nel login: ' + error.message);
        console.error(error);
        return;
      }

      if (data.length === 0) {
        alert('Credenziali errate');
      } else {
        alert('Accesso effettuato con successo!');
        localStorage.setItem('user', JSON.stringify(data[0]));
        window.location.href = 'index.html';
      }
    }

    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("mousedown", function () {
      passwordInput.type = "text";
      this.textContent = "Nascondi";
    });

    togglePassword.addEventListener("mouseup", function () {
      passwordInput.type = "password";
      this.textContent = "Mostra";
    });

    togglePassword.addEventListener("mouseleave", function () {
      passwordInput.type = "password";
      this.textContent = "Mostra";
    });



  </script>

</body>
</html>
