<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrazione</title>
  <link rel="stylesheet" href="../styles/profilo/register.css" />
  <link rel="stylesheet" href="../styles/styles.css" />
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo-link">
      <div class="logo">WorkSpace Pro</div>
    </a>
  </header>

  <div class="wrapper">
    <div class="login-container wide">
      <h2>Registrati</h2>
      <form id="registrationForm" class="form-grid">
        <!-- Colonna Sinistra -->
        <div class="form-group">
          <label for="username">Username: <span class="required">*</span></label>
          <input type="text" id="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password: <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" required>
            <button type="button" id="togglePassword" class="toggle-password">Mostra</button>
          </div>
          <small class="password-hint">Min. 6 caratteri e 1 lettera maiuscola</small>
        </div>

        <div class="form-group">
          <label for="email">Email: <span class="required">*</span></label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="address">Indirizzo:</label>
          <input type="text" id="address">
        </div>

        <div class="form-group">
          <label for="phone">Telefono:</label>
          <input type="text" id="phone">
        </div>

        <div class="form-group">
          <label for="role">Ruolo: <span class="required">*</span></label>
          <select id="role" class="styled-select" required>
            <option value="">Seleziona un ruolo</option>
            <option value="cliente">Cliente</option>
            <option value="gestore">Gestore</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nome">Nome: <span class="required-marker"></span></label>
          <input type="text" id="nome">
        </div>

        <div class="form-group">
          <label for="cognome">Cognome: <span class="required-marker"></span></label>
          <input type="text" id="cognome">
        </div>

        <div class="form-group">
          <label for="azienda">Azienda:</label>
          <input type="text" id="azienda">
        </div>

        <div class="form-group">
          <label for="piva">Partita IVA o Ind. Fatturazione: <span class="required-marker"></span></label>
          <input type="text" id="piva">
        </div>

        <div class="form-group full-width">
          <button type="submit" class="login-button" id="submitBtn">Registrati</button>
        </div>
      </form>

      <p class="note"><span class="required">*</span> Campi obbligatori</p>
      <p>Hai già un account? <a href="login.html">Accedi</a></p>
    </div>
  </div>
  <div id="popup-verifica-email" class="overlay-popup" style="display: none;"></div>

  <script type="module" src="../js/profilo/register.js"></script>
</body>
</html>
