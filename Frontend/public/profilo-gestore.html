<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Profilo Gestore | WorkSpace Pro</title>
  <link rel="stylesheet" href="styles/profilo-gestore.css" />
<link rel="stylesheet" href="styles/styles.css" />

</head>
<body onload="caricaDatiGestore()">

    <header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo">WorkSpace Pro</div>
    </a>
    </header>
    
  <main class="main-content">
    <section class="profile-overview">
      <img id="avatar" class="avatar" src="placeholder-avatar.png" alt="Avatar">
      <div class="profile-info">
        <h1 id="nomeCognome"></h1>
        <p id="azienda"></p>
        <div class="ratings">
          <span id="rating">4.8</span> · <span id="reviews">23 recensioni</span>
        </div>
      </div>
      <button onclick="modificaProfilo()" class="btn-edit">Modifica profilo</button>
    </section>

    <section class="profile-toolbar">
      <button onclick="navigate('ordini')">I miei ordini</button>
      <button onclick="navigate('sicurezza')">Accesso & Sicurezza</button>
      <button onclick="navigate('pagamenti')">Pagamenti</button>
      <button onclick="navigate('indirizzi')">Indirizzi</button>
      <button onclick="navigate('comunicazioni')">Comunicazioni</button>
    </section>


    <section id="section-content" class="section-content">
      <!-- contenuti dinamici caricati da JS -->
    </section>
  </main>

  <script src="src/profilo-gestore.js"></script>
</body>
</html>
