<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="stylesheet" href="../../styles/avatar.css">
    <link rel="stylesheet" href="../../styles/stilecontenutigestore.css">
    <script type="module" src="../../js/index.js"></script>
    <script type="module" src="../../js/contenuti_gestore/modifica_spazio.js"></script>
    <script type="module">
        import { caricaAvatarUtente } from '../../js/gestione_avatar.js';
        import { loadSpazioData } from '../../js/contenuti_gestore/modifica_spazio.js';

        window.addEventListener('DOMContentLoaded', () => {
            caricaAvatarUtente();
            const urlParams = new URLSearchParams(window.location.search);
            const spazioId = urlParams.get('id_spazio');
            if (spazioId) {
                loadSpazioData(spazioId);
            } else {
                alert('ID dello spazio non fornito.');
                window.location.href = '../dashboard_gestore.html';
            }
        });
    </script>
    <title>WorkSpace Pro - Modifica il tuo spazio</title>
</head>

<body>
    <header class="header">
        <a href="../dashboard_gestore.html" class="logo-link">
            <div class="logo">WorkSpace Pro</div>
        </a>
        <div class="profile-section">
            <div class="profile-btn" onclick="toggleProfileMenu()">
                <img id="avatar" class="avatar avatar-small"
                    src="https://sbxrdptjegjxqaklfpxq.supabase.co/storage/v1/object/public/immaginiprofilo//user.png"
                    alt="Avatar" />
            </div>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-item" id="loginText" onclick="accedi()">
                    <span>🔑 Accedi&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" onclick="registrati()">
                    <span>📝 Registrati&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" id="profileItem" style="display: none;" onclick="handleProfile()">
                    <span>🔓 Il mio profilo&nbsp;&nbsp;</span>
                </div>
                <div class="dropdown-item" id="logoutItem" style="display: none;" onclick="handleLogout()">
                    <span>🚪 Esci&nbsp;&nbsp;</span>
                </div>
            </div>
        </div>
    </header>
    <main>

        <section class="welcome-section"></div>
        <h1 id="titolo-modifica-spazio"></h1>
        <p class="welcome-subtitle">Potrai scegliere di modificare o eliminare lo spazio.</p>
        </section>

        <div id="image-carousel-container">
            <div id="image-preview-container"></div>
        </div>

        <form id="form-modifica-spazio" enctype="multipart/form-data">
            <div class="form-group images-group">
                <label>Immagini dello spazio:</label>
                <div class="file-input-container">
                    <input type="file" id="immagini-input" name="immagini" multiple accept="image/*">
                    <button type="button" id="rimuovi-immagini-btn" style="display:none;">Rimuovi</button>
                </div>
            </div>

            <div id="form-columns">
                <div class="column">
                    <label>
                        Indirizzo:
                        <input type="text" name="indirizzo_spazio" required>
                    </label>
                    <label>
                        Numero civico:
                        <input type="text" name="numero_civico" required>
                    </label>
                    <label>
                        Città:
                        <input type="text" name="città" required>
                    </label>
                    <label>
                        Provincia:
                        <input type="text" name="provincia" required>
                    </label>
                    <label>
                        Nazione:
                        <input type="text" name="nazione" required>
                    </label>
                </div>
                <div class="column">
                    <label>
                        Categoria:
                        <select name="categoria" required>
                            <option value="sala riunioni">sala riunioni</option>
                            <option value="ufficio privato">ufficio privato</option>
                            <option value="postazione coworking">postazione coworking</option>
                        </select>
                    </label>
                    <label>
                        Capienza massima:
                        <input type="number" name="capienza_max" min="1" required>
                    </label>
                    <label>
                        Prezzo/ora (€):
                        <input type="number" name="prezzo_ora" min="0" step="0.01" required>
                    </label>
                    <label>
                        Descrizione breve:
                        <input type="text" name="descrizione_breve" maxlength="100" required>
                    </label>
                </div>
            </div>

            <label>
                Descrizione lunga:
                <textarea name="descrizione_lunga" rows="4" required></textarea>
            </label>
        </form>

        <button type="submit" id="submit-btn" form="form-modifica-spazio">Salva Modifiche</button>
        <button type="button" id="delete-btn">Elimina Spazio</button>

    </main>
    <script type="module">
        import { modificaSpazio, rimuoviSpazio, loadSpazioData } from '../../js/contenuti_gestore/modifica_spazio.js';
        import { caricaAvatarUtente } from '../../js/gestione_avatar.js';

        window.addEventListener('DOMContentLoaded', () => {
            caricaAvatarUtente();
            const urlParams = new URLSearchParams(window.location.search);
            const spazioId = urlParams.get('id_spazio');
            if (spazioId) {
                loadSpazioData(spazioId);
            } else {
                alert('ID dello spazio non fornito.');
                window.location.href = '../dashboard_gestore.html';
            }
        });

        document.getElementById('form-modifica-spazio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const urlParams = new URLSearchParams(window.location.search);
            const id_spazio = urlParams.get('id_spazio');
            const newFiles = form.immagini.files;

            const formData = {
                indirizzo_spazio: form.indirizzo_spazio.value,
                numero_civico: parseInt(form.numero_civico.value),
                città: form.città.value,
                provincia: form.provincia.value,
                nazione: form.nazione.value,
                categoria: form.categoria.value,
                capienza_max: parseInt(form.capienza_max.value),
                prezzo_ora: parseFloat(form.prezzo_ora.value),
                descrizione_breve: form.descrizione_breve.value,
                descrizione_lunga: form.descrizione_lunga.value
            };

            await modificaSpazio(formData, newFiles, id_spazio);
        });

        document.getElementById('delete-btn').addEventListener('click', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id_spazio = urlParams.get('id_spazio');
            if (id_spazio) {
                await rimuoviSpazio(id_spazio);
            }
        });
    </script>
</body>

</html>
